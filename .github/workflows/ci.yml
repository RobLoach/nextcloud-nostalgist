name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Nextcloud 29 to 35 run on.
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint
        run: |
          find appinfo lib templates -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the test suite
        run: composer test

  build:
    name: JavaScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check the committed bundles are up to date
        # Dependencies float without a lock file, so a difference here is a
        # hint to rebuild rather than a reason to fail the build.
        continue-on-error: true
        run: |
          if ! git diff --quiet -- js/; then
            echo "::warning::js/ differs from a fresh build, run 'npm run build' and commit the result"
            git diff --stat -- js/
          fi

  appinfo:
    name: App metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate info.xml against the Nextcloud schema
        run: |
          curl -sSfo info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema info.xsd appinfo/info.xml

      - name: Check the versions match
        run: |
          app=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | head -1)
          npm=$(node -p "require('./package.json').version")
          echo "info.xml $app, package.json $npm"
          test "$app" = "$npm"
