name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions Nextcloud 34 and 35 run on, from the 8.3 the app asks for.
        php-version: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint
        run: |
          find appinfo lib templates -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the test suite
        run: composer test

  psalm:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Analyse
        run: composer psalm

  build:
    name: JavaScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Without install scripts: the one of @nextcloud/webpack-vue-config
        # fails the install over the vue-loader version needed for single
        # file components, which this app has none of.
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build vue-demi
        # It picks its Vue 2 or Vue 3 build in an install script, and the
        # bundles do not compile without it.
        run: npm rebuild vue-demi

      - name: Build
        run: npm run build

      - name: Check the committed bundles are up to date
        # Dependencies float without a lock file, so a difference here is a
        # hint to rebuild rather than a reason to fail the build.
        continue-on-error: true
        run: |
          if ! git diff --quiet -- js/; then
            echo "::warning::js/ differs from a fresh build, run 'npm run build' and commit the result"
            git diff --stat -- js/
          fi

  appinfo:
    name: App metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml
          coverage: none

      - name: Validate info.xml against the Nextcloud schema
        run: |
          curl -sSfo /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          php -r '
            $doc = new DOMDocument();
            $doc->load("appinfo/info.xml");
            libxml_use_internal_errors(true);
            if ($doc->schemaValidate("/tmp/info.xsd")) {
              echo "info.xml validates\n";
              exit(0);
            }
            foreach (libxml_get_errors() as $error) {
              fwrite(STDERR, trim($error->message) . "\n");
            }
            exit(1);
          '

      - name: Check the versions match
        run: |
          app=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' appinfo/info.xml | head -1)
          npm=$(node -p "require('./package.json').version")
          echo "info.xml $app, package.json $npm"
          test "$app" = "$npm"
